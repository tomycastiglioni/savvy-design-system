<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Perspectives email banner — November 2026</title>
<style>
/* ==========================================================================
   SAVVY PORTFOLIO PERSPECTIVES — EMAIL BANNER (header image for the monthly email)
   Matches Figma "Portfolio Perspectives_October" (file XYp5xl61nCXvKUjuc4jLEL, node 32544:195).
   600 × 150 px, exported as a 1200 × 300 PNG (2×) by export_pdf.py. Only the month changes.
   ========================================================================== */
:root{--display:'ABC Diatype','Diatype','Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --sans:'Inter',-apple-system,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#2B3135;-webkit-font-smoothing:antialiased}
.deck{display:flex;justify-content:center;padding:40px 0}
.banner{width:600px;height:150px;position:relative;overflow:hidden;border-radius:6px;color:#fff;
  background:linear-gradient(215deg,#095972 0%,#000D11 100%)}
.banner .globe{position:absolute;left:0;top:0}
.banner h1{position:absolute;left:27.5px;top:21.3px;width:222.5px;font-family:var(--display);font-weight:300;
  font-size:40.06px;line-height:1.05;letter-spacing:-.02em}
.banner .month{position:absolute;right:27.2px;top:24.3px;padding:12.8px;display:flex;
  background:rgba(255,255,255,.1);border-radius:3.3px;font-family:var(--sans);font-weight:500;font-size:9.82px;line-height:10px;
  letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
/* equal padding on all four sides (email banner rule), measured to the letters: the line box is trimmed to the
   capitals (text-box), and the trailing letter-spacing after the last character is cancelled */
.banner .month span{display:block;margin-right:-.18em;text-box:trim-both cap alphabetic}
</style>
</head>
<body>
<main class="deck">
<section class="banner">
  <svg class="globe" width="600" height="150" fill="none" stroke="#095972" stroke-width="1" aria-hidden="true">
    <circle cx="493" cy="236.6" r="254.1"/>
    <ellipse cx="493" cy="236.6" rx="177.9" ry="254.1"/>
    <ellipse cx="493" cy="236.6" rx="101.6" ry="254.1"/>
    <ellipse cx="493" cy="236.6" rx="25.4" ry="254.1"/>
  </svg>
  <h1>Portfolio Perspectives</h1>
  <div class="month"><span>November 2026</span></div>   <!-- EDIT: month and year -->
</section>
</main>
</body>
</html>
